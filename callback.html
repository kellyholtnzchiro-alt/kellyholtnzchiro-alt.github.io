<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Tesla sign-in code</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 24px; line-height: 1.4; }
    textarea { width: 100%; height: 9em; font-size: 14px; }
    button { font-size: 18px; padding: 12px 20px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Nearly done</h1>
  <p>Tap Copy, then paste it into the secure box in your Grok Bot chat. Don't paste it into the normal chat. This page doesn't send it anywhere.</p>
  <textarea id="u" readonly></textarea>
  <br><button id="b">Copy</button> <span id="m"></span>
  <script>
    var t = document.getElementById("u");
    t.value = window.location.href;
    document.getElementById("b").onclick = function () {
      t.select();
      try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand("copy"); }
      document.getElementById("m").textContent = "Copied";
    };
  </script>
</body>
</html>
